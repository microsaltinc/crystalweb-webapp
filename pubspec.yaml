name: crystalapp
description: CrystalApp — SEM salt crystal analysis and annotation management
publish_to: 'none'
version: 0.9.40+40

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  intl: ^0.19.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  url_launcher: ^6.3.0
  web: ^1.1.1
  # CRY-54: pinned viewer scroll fix; see third_party/pdfx/README.crystalweb.md.
  pdfx:
    path: third_party/pdfx
  package_info_plus: ^9.0.1
  crypto: ^3.0.7
  uuid: ^4.6.0
  unorm_dart: ^0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  mockito: ^5.4.0
  mocktail: ^1.0.0
  network_image_mock: ^2.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
