log_format crystalweb_no_args '$remote_addr - $remote_user [$time_local] '
  '"$request_method $uri $server_protocol" $status $body_bytes_sent '
  '"$http_user_agent"';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout crystalweb_no_args;
    error_log /dev/stderr crit;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    root /usr/share/nginx/html;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
